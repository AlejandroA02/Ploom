<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  html, body { margin: 0; height: 100%; background: transparent; display: grid; place-items: center; }
  .n {
    width: 168px; height: 168px; border-radius: 50%; display: grid; place-items: center;
    background: rgba(20,20,26,.82); border: 1px solid rgba(255,255,255,.1);
    box-shadow: 0 10px 24px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.07);
    color: #fff; font: 600 84px 'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif; letter-spacing: -.04em;
    animation: pop .9s ease-out;
  }
  @keyframes pop {
    0% { transform: scale(.6); opacity: 0; }
    25% { transform: scale(1.05); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
</style>
</head>
<body>
  <div class="n" id="n">3</div>
<script>
  let n = 3
  const el = document.getElementById('n')
  setInterval(() => {
    if (n <= 1) return
    el.textContent = --n
    // Restart the pop animation for each number
    el.style.animation = 'none'
    el.offsetWidth
    el.style.animation = ''
  }, 1000)
</script>
</body>
</html>
